<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A four-question quiz about HTML and CSS fundamentals.">
  <meta name="author" content="Henry Bradley">
  <title>HTML and CSS Quiz</title>
  <link rel="stylesheet" href="styles/quiz.css">
</head>
<body>
  <header>
    <h1>HTML and CSS Quiz</h1>
  </header>
  <main>
    <form>
      <label for="q1">1. What does CSS stand for?</label>
      <input type="text" id="q1" name="q1" required>

      <label for="q2">2. Explain the difference between margin and padding in CSS.</label>
      <textarea id="q2" name="q2" rows="4" required></textarea>

      <label for="q3">3. Which HTML element creates a hyperlink?</label>
      <select id="q3" name="q3" required>
        <option value="" selected disabled>Choose One ...</option>
        <option value="a">&lt;a&gt;</option>
        <option value="p">&lt;p&gt;</option>
        <option value="div">&lt;div&gt;</option>
      </select>

      <label for="q4">4. How many columns does a cell span when it has colspan="3"?</label>
      <input type="number" id="q4" name="q4" step="1" required>

      <button type="submit">Submit Quiz</button>
    </form>
  </main>
</body>
</html>
