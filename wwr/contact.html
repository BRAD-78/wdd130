<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Contact Whitewater Rafting in Jinja, Uganda, ask about trips and reservations, and meet our guide, reservations, and safety team.">
    <meta name="author" content="Henry Bradley Ochieng">
    <title>Contact Us — Plan Your River Visit | Whitewater Rafting</title>
    <link rel="icon" href="images/raftinglogo.webp" type="image/webp">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header>
        <a class="brand" href="index.html" aria-label="Whitewater Rafting home"><img src="images/raftinglogo.webp" alt="Whitewater Rafting logo" width="182" height="149"></a>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html" aria-current="page">Contact Us</a>
        </nav>
    </header>
    <main id="main-content" class="contact-page section-space">
        <h1>Contact Us</h1>

        <div class="contact-layout">
            <section class="company-info">
                <h2>Whitewater Rafting</h2>
                <address>
                    <p>Address: Main Street, Jinja, Uganda</p>
                    <p>Phone: <a href="tel:+256700000000">+256 700 000 000</a></p>
                    <p>Email: <a href="mailto:info@example.com">info@example.com</a></p>
                </address>
                <iframe
                    src="https://maps.google.com/maps?q=Jinja%2C%20Uganda&amp;output=embed"
                    title="Map of Jinja, Uganda"
                    width="350" height="250"
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"
                    allowfullscreen></iframe>
            </section>

            <section class="contact-form-section">
                <h2>Send Us a Message</h2>
                <form class="contact-form" action="contact.html" method="get">
                    <label for="fullname">Name:</label>
                    <input type="text" id="fullname" name="fullname" autocomplete="name" required>

                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail" autocomplete="email" required>

                    <fieldset>
                        <legend>Purpose of the message</legend>
                        <div class="radio-option">
                            <input type="radio" id="general" name="purpose" value="general-inquiry" required>
                            <label for="general">General Inquiry</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="reservation" name="purpose" value="reservation-question">
                            <label for="reservation">Reservation Question</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="suggestion" name="purpose" value="website-suggestion">
                            <label for="suggestion">Website Suggestion</label>
                        </div>
                    </fieldset>

                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>

                    <div class="newsletter-option">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                    </div>

                    <button type="submit">Send Message</button>
                </form>
            </section>
        </div>

        <section class="employees">
            <h2>Meet Our Team</h2>
            <figure>
                <img src="images/employee-guide.webp" alt="Sample portrait of a rafting guide" width="240" height="240" loading="lazy">
                <figcaption>Rafting Guide</figcaption>
            </figure>
            <figure>
                <img src="images/employee-reservations.webp" alt="Sample portrait of a reservations coordinator" width="240" height="240" loading="lazy">
                <figcaption>Reservations Coordinator</figcaption>
            </figure>
            <figure>
                <img src="images/employee-safety.webp" alt="Sample portrait of a safety manager" width="240" height="240" loading="lazy">
                <figcaption>Safety Manager</figcaption>
            </figure>
        </section>
    
    </main>
    <footer>
        <p>&copy; 2026 Whitewater Rafting | Henry Bradley Ochieng</p>
        <nav class="socialmedia" aria-label="Social media">
            <a href="https://facebook.com"><img src="images/facebook.png" alt="Facebook" width="64" height="64"></a>
            <a href="https://linkedin.com"><img src="images/linkedin.png" alt="LinkedIn" width="64" height="64"></a>
            <a href="https://instagram.com"><img src="images/instagram.png" alt="Instagram" width="64" height="62"></a>
        </nav>
    </footer>
</body>
</html>
